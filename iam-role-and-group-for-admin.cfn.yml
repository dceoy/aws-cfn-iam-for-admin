---
AWSTemplateFormatVersion: 2010-09-09
Description: IAM user groups for administrators
Resources:
  AdminRoleToSwitch:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AdminRoleToSwitch
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      MaxSessionDuration: 43200
      Tags:
        - Key: Name
          Value: AdminRoleToSwitch
  AccountRolesSwitcherGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: account-roles-switch-group
      Path: /
      Policies:
        - PolicyName: account-roles-switch-policy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/*
  ReadOnlyUserGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: read-only-user-group
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
  SelfManagedIamUserGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: self-managed-iam-user-group
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SignInLocalDevelopmentAccess
        - arn:aws:iam::aws:policy/IAMUserChangePassword
      Policies:
        - PolicyName: iam-user-mfa-policy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - iam:ListVirtualMFADevices
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:CreateVirtualMFADevice
                Resource:
                  - 'arn:aws:iam::*:mfa/*'
              - Effect: Allow
                Action:
                  - iam:DeleteVirtualMFADevice
                  - iam:ListMFADeviceTags
                  - iam:TagMFADevice
                  - iam:UntagMFADevice
                Resource:
                  - 'arn:aws:iam::*:mfa/${aws:username}'
              - Effect: Allow
                Action:
                  - iam:EnableMFADevice
                  - iam:GetMFADevice
                  - iam:GetUser
                  - iam:ListMFADevices
                  - iam:ResyncMFADevice
                Resource:
                  - 'arn:aws:iam::*:user/${aws:username}'
              - Effect: Allow
                Action:
                  - iam:DeactivateMFADevice
                Resource:
                  - 'arn:aws:iam::*:user/${aws:username}'
                Condition:
                  Bool:
                    aws:MultiFactorAuthPresent: 'true'
        - PolicyName: iam-user-access-key-cleanup-policy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - iam:DeleteAccessKey
                  - iam:GetAccessKeyLastUsed
                  - iam:ListAccessKeys
                Resource:
                  - 'arn:aws:iam::*:user/${aws:username}'
  LongTermAccessKeyDenyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Deny creating long-term IAM access keys.
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Deny
            Action:
              - iam:CreateAccessKey
            Resource: '*'
      Roles:
        - !Ref AdminRoleToSwitch
      Groups:
        - !Ref AccountRolesSwitcherGroup
        - !Ref ReadOnlyUserGroup
        - !Ref SelfManagedIamUserGroup
Outputs:
  AdminRoleToSwitchArn:
    Value: !GetAtt AdminRoleToSwitch.Arn
    Export:
      Name: !Sub ${AWS::Region}-${AWS::StackName}-AdminRoleToSwitchArn
  AccountRolesSwitcherGroup:
    Value: !Ref AccountRolesSwitcherGroup
    Export:
      Name: !Sub ${AWS::Region}-${AWS::StackName}-AccountRolesSwitcherGroup
  ReadOnlyUserGroup:
    Value: !Ref ReadOnlyUserGroup
    Export:
      Name: !Sub ${AWS::Region}-${AWS::StackName}-ReadOnlyUserGroup
  SelfManagedIamUserGroup:
    Value: !Ref SelfManagedIamUserGroup
    Export:
      Name: !Sub ${AWS::Region}-${AWS::StackName}-SelfManagedIamUserGroup
