---
name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    uses: dceoy/gha-for-devops/.github/workflows/aws-cloudformation-lint.yml@2a8aaab7fcc91494813c33293345e000244a0d90  # v2.3.1
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - lint
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@2a8aaab7fcc91494813c33293345e000244a0d90  # v2.3.1
    with:
      unconditional: true
